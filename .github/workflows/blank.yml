name: Build Subscriber Debt APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: فك ملف المشروع
        run: |
          mkdir -p project
          unzip -q SubscriberDebtApp_v2_phone_build.zip -d project

      - name: تحديد مجلد المشروع
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: تفعيل Java 17 و AndroidX
        run: |
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: إنشاء إعدادات توافق Java و Kotlin
        run: |
          cat > "$PROJECT_DIR/jvm17.init.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach {
                  if (name.contains("Kotlin") || name.contains("ksp")) {
                      try {
                          if (hasProperty("kotlinOptions")) {
                              kotlinOptions.jvmTarget = "17"
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon \
            --init-script jvm17.init.gradle \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: SubscriberDebtApp-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
